<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080d18" />
    <title>Восстановление VideoGrace</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #080d18; color: #f8fafc; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 28px;
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { border-radius: 18px; }
      h1 { margin: 16px 0 8px; font-size: 22px; }
      p { margin: 0; color: #94a3b8; }
      a {
        display: inline-block;
        margin-top: 22px;
        border-radius: 10px;
        padding: 11px 18px;
        background: #0284c7;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="VideoGrace" width="72" height="72" />
      <h1>Восстанавливаем запуск</h1>
      <p id="status">Обновляем Service Worker и локальный кэш. Аккаунты и сообщения сохранятся.</p>
      <a id="continue" href="/" hidden>Открыть VideoGrace</a>
    </main>
    <script>
      (function () {
        var finished = false;
        var complete = function () {
          if (finished) return;
          finished = true;
          try { sessionStorage.removeItem('vg_entry_reload_target'); } catch (error) {}
          window.location.replace('/?vg_recovered=' + Date.now());
        };
        var failed = function () {
          var status = document.getElementById('status');
          var link = document.getElementById('continue');
          status.textContent = 'Автоматическое восстановление не завершилось. Откройте приложение еще раз.';
          link.hidden = false;
        };
        var tasks = [];

        try {
          if ('serviceWorker' in navigator) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            }));
          }
          if ('caches' in window) {
            tasks.push(caches.keys().then(function (names) {
              return Promise.all(names.map(function (name) { return caches.delete(name); }));
            }));
          }
        } catch (error) {
          failed();
          return;
        }

        Promise.all(tasks).then(complete, failed);
        window.setTimeout(failed, 6000);
      }());
    </script>
  </body>
</html>
